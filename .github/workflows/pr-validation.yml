
name: Finance POC - PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: finance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-code:
    name: PR validation - Python tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Git whitespace errors
        run: git diff --check

      - name: Compile Python source
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: pytest -q
