
name: Finance POC - PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: finance-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-code:
    name: PR Validation - Centralized Governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================
      # 1. CENTRALIZED AST GOVERNANCE VALIDATION
      # ============================================
      - name: Run Centralized AST Validation
        env:
          SCAN_ROOT: ${{ github.workspace }}
        run: |
          python validations/validation_check.py

      # ============================================
      # 1.2 INSTALL GITLEAKS
      # ============================================
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.28.0"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

          gitleaks version

      # ============================================
      # 2. SECURITY - GITLEAKS
      # ============================================
      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0

      # ============================================
      # 3. FORMAT SECURITY REPORT
      # ============================================
      - name: Format Gitleaks Report
        env:
          SCAN_ROOT: ${{ github.workspace }}
        run: |
          python validation/gitleaks_formatter.py

      # ============================================
      # 4. FINAL GOVERNANCE REPORT & BLOCKING GATE
      # ============================================
      - name: Generate Governance Report
        env:
          SCAN_ROOT: ${{ github.workspace }}
        run: |
          python validation/final_report.py

      # ============================================
      # 5. TECHNICAL VALIDATION
      # ============================================
      - name: Check Git whitespace errors
        run: |
          git diff --check

      - name: Compile Python source
        run: |
          python -m compileall -q src tests

      - name: Run unit tests
        run: |
          pytest -q
