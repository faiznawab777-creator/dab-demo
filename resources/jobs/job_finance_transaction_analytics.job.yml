resources:
  jobs:
    job_finance_transaction_analytics:
      name: ${bundle.target}-finance-transaction-analytics
      max_concurrent_runs: 1
      tasks:
        - task_key: generate_transaction_batch
          existing_cluster_id: ${var.job_cluster_id}
          notebook_task:
            notebook_path: ../../src/notebooks/finance/nb_generate_transactions.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              batch_size: "100"
              batch_label: "scheduled_poc_batch"
        - task_key: update_sdp_pipeline
          depends_on:
            - task_key: generate_transaction_batch
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_finance_transaction_analytics.id}
            full_refresh: false
